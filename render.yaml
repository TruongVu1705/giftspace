services:
  - type: web
    name: giftspace-backend
    env: node
    plan: free
    region: singapore # hoặc oregon / frankfurt
    buildCommand: npm install && cd backend && npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
