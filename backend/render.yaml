services:
  - type: web
    name: giftspace-backend
    env: node
    plan: free
    region: singapore # hoặc oregon / frankfurt
    buildCommand: npm install && npm rebuild sqlite3 --build-from-source
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
