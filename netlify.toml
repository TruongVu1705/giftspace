[build]
  base = "frontend"
  publish = "frontend"
  command = ""

# ==============================================================================
# 1. API PROXY REWRITE: Chuyển tiếp toàn bộ yêu cầu /api/* sang Server Render
# Backend URL: https://giftspace-o7bq.onrender.com
# ==============================================================================
[[redirects]]
  from = "/api/*"
  to = "https://giftspace-o7bq.onrender.com/api/:splat"
  status = 200
  force = true

# ==============================================================================
# 2. Chuyển hướng các đường dẫn tĩnh không tồn tại về index.html
# ==============================================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
