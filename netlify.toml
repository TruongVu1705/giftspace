[build]
  # Nếu deploy cả repo, Netlify sẽ lấy giao diện từ thư mục frontend/
  base = "frontend"
  publish = "frontend"
  command = ""

# ==============================================================================
# 1. API PROXY REWRITE: Chuyển tiếp toàn bộ yêu cầu /api/* sang Server Render
# HƯỚNG DẪN: Thay thế URL bên dưới bằng URL Render của bạn
# (Ví dụ: https://giftspace-backend.onrender.com/api/:splat)
# ==============================================================================
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_URL.onrender.com/api/:splat"
  status = 200
  force = true

# ==============================================================================
# 2. Chuyển hướng các đường dẫn tĩnh không tồn tại về index.html
# ==============================================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
